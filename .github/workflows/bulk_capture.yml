name: bulk-capture

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Show URL'
        required: true
        default: 'https://www.lookmovie2.to/shows/view/0182576-family-guy-1999'
        type: string
      show:
        description: 'Show name for filename'
        required: true
        default: 'FG'
        type: string
      seasons:
        description: 'Seasons (e.g. 1-25 or 1,3,5)'
        required: true
        default: '1-25'
        type: string
      base_dir:
        description: 'Base remote dir (one subfolder per season)'
        required: true
        default: '/_Rescue_Uploads/encrypted/FG'
        type: string
      max_episodes:
        description: 'Max episodes per season'
        required: true
        default: '30'
        type: string
      max_parallel:
        description: 'Max parallel season jobs'
        required: true
        default: '10'
        type: string
      browser:
        description: 'Browser engine'
        required: false
        default: 'camoufox'
        type: choice
        options:
          - patchright
          - camoufox

concurrency:
  group: bulk-capture
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Parse seasons
        id: build
        run: |
          MATRIX=$(python3 ci/parse_seasons.py "${{ inputs.seasons }}")
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "matrix: $MATRIX"

  capture:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    name: "S${{ matrix.season }}"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: System deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg curl aria2

      - name: Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Browsers
        run: |
          patchright install --with-deps chromium
          python -m camoufox fetch || true

      - name: Write .env
        env:
          TB1_COOKIE: ${{ secrets.TERABOX_1_COOKIE }}
          TB1_USER: ${{ secrets.TERABOX_1_USERNAME }}
          TB1_PASS: ${{ secrets.TERABOX_1_PASSWORD }}
        run: |
          {
            echo "TERABOX_1_USERNAME=$TB1_USER"
            echo "TERABOX_1_PASSWORD=$TB1_PASS"
            echo "TERABOX_1_COOKIE=$TB1_COOKIE"
          } > .env
          chmod 600 .env

      - name: Capture season ${{ matrix.season }}
        env:
          EE_TB_PASSPHRASE: ${{ secrets.BULK_PASSPHRASE }}
          PIPELINE_NONINTERACTIVE: '1'
          PIPELINE_HEADLESS_SNIFF: '1'
          PIPELINE_REMOTE_DIR: ${{ inputs.base_dir }}/S_${{ matrix.season }}
          MANIFEST_PATH: ${{ github.workspace }}/uploads_S${{ matrix.season }}.csv
          DOWNLOAD_DIR: /tmp/bulk_downloads
          YTDLP_PATH: yt-dlp
          CAPTURE_BROWSER: ${{ inputs.browser }}
        run: |
          echo "::add-mask::${{ secrets.BULK_PASSPHRASE }}"
          mkdir -p /tmp/bulk_downloads
          python Browser_dual_account_C.py \
            --url "${{ inputs.url }}" \
            --show "${{ inputs.show }}" \
            --season ${{ matrix.season }} \
            --episodes "1-${{ inputs.max_episodes }}" \
            --wait 25 \
            --headless \
            --account 1

      - name: Upload manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manifest-S${{ matrix.season }}
          path: uploads_S${{ matrix.season }}.csv
          retention-days: 30
          if-no-files-found: ignore
