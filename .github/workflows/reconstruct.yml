name: reconstruct

on:
  workflow_dispatch:
    inputs:
      ghost_folder:
        description: 'Full TeraBox path to the ghost folder'
        required: true
        default: '/_Rescue_Uploads/encrypted/Ghosts/09c0e08161b7a4c6be77ff3c4a77cbfe'
        type: string
      passphrase:
        description: 'Decryption passphrase (per-run, not stored)'
        required: true
        type: string
      dest_account:
        description: 'TeraBox account to receive the decrypted MP4 (1/2/3)'
        required: true
        default: '1'
        type: choice
        options: ['1', '2', '3']
      dest_dir:
        description: 'Remote folder for the decrypted MP4'
        required: true
        default: '/decrypted'
        type: string
      keep_shards:
        description: 'Leave shards on TeraBox after reconstruct'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

concurrency:
  group: reconstruct
  cancel-in-progress: false

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg curl aria2

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chromium (patchright)
        run: patchright install --with-deps chromium

      - name: Write .env from secrets
        env:
          TB1_COOKIE: ${{ secrets.TERABOX_1_COOKIE }}
          TB2_COOKIE: ${{ secrets.TERABOX_2_COOKIE }}
          TB3_COOKIE: ${{ secrets.TERABOX_3_COOKIE }}
          TB1_USER: ${{ secrets.TERABOX_1_USERNAME }}
          TB2_USER: ${{ secrets.TERABOX_2_USERNAME }}
          TB3_USER: ${{ secrets.TERABOX_3_USERNAME }}
          TB1_PASS: ${{ secrets.TERABOX_1_PASSWORD }}
          TB2_PASS: ${{ secrets.TERABOX_2_PASSWORD }}
          TB3_PASS: ${{ secrets.TERABOX_3_PASSWORD }}
          DISCORD_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          {
            echo "TERABOX_1_USERNAME=$TB1_USER"
            echo "TERABOX_1_PASSWORD=$TB1_PASS"
            echo "TERABOX_1_COOKIE=$TB1_COOKIE"
            echo "TERABOX_2_USERNAME=$TB2_USER"
            echo "TERABOX_2_PASSWORD=$TB2_PASS"
            echo "TERABOX_2_COOKIE=$TB2_COOKIE"
            echo "TERABOX_3_USERNAME=$TB3_USER"
            echo "TERABOX_3_PASSWORD=$TB3_PASS"
            echo "TERABOX_3_COOKIE=$TB3_COOKIE"
            if [ -n "$DISCORD_URL" ]; then
              echo "DISCORD_WEBHOOK_URL=$DISCORD_URL"
              echo "NOTIFY=discord"
            else
              echo "NOTIFY=none"
            fi
          } > .env
          chmod 600 .env

      - name: Reconstruct + decrypt (local on runner)
        env:
          EE_TB_PASSPHRASE: ${{ inputs.passphrase }}
          PIPELINE_NONINTERACTIVE: '1'
          PIPELINE_HEADLESS_SNIFF: '1'
          DOWNLOAD_DIR: /tmp/reconstruct_out
        run: |
          echo "::add-mask::${{ inputs.passphrase }}"
          mkdir -p /tmp/reconstruct_out
          python Browser_dual_account_C.py \
            --ghost-reconstruct "${{ inputs.ghost_folder }}" \
            --out /tmp/reconstruct_out \
            --threads 16
          echo "── files in /tmp/reconstruct_out ──"
          ls -lh /tmp/reconstruct_out/

      - name: Upload decrypted MP4 to TeraBox
        env:
          PIPELINE_NONINTERACTIVE: '1'
          PIPELINE_HEADLESS_SNIFF: '1'
        run: |
          MP4=$(ls /tmp/reconstruct_out/*.mp4 | head -1)
          if [ -z "$MP4" ]; then
            echo "no MP4 produced"
            exit 1
          fi
          python ci/upload_one.py "$MP4" \
            --account ${{ inputs.dest_account }} \
            --remote-dir "${{ inputs.dest_dir }}" \
            --skip-rapid

      - name: Optional cleanup of shards
        if: ${{ inputs.keep_shards == 'false' }}
        env:
          EE_TB_PASSPHRASE: ${{ inputs.passphrase }}
          PIPELINE_NONINTERACTIVE: '1'
          PIPELINE_HEADLESS_SNIFF: '1'
        run: |
          echo "cleanup requested — running ghost-cleanup"
          python Browser_dual_account_C.py \
            --ghost-cleanup "${{ inputs.ghost_folder }}"

      - name: Upload manifest artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uploads-manifest
          path: uploads.csv
          retention-days: 30
          if-no-files-found: ignore
